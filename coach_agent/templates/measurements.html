<!doctype html>
<!--
  The weight / body-fat report. Filled by reports.render_measurements through
  string.Template, so every hole below is a $name and never a {brace} — the CSS
  is full of braces, and str.format would choke on the first one.

  One file, no network: no stylesheet link, no font download, no script. A page
  that fetched a font would send the trainee's IP to a third party at the moment
  they open their own health data, which is the same reason the file is sent
  through Telegram instead of hosted.
-->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$title</title>
<style>
  :root {
    --plane:   #f9f9f7;
    --surface: #fcfcfb;
    --ink:     #0b0b0b;
    --ink-2:   #52514e;
    --muted:   #898781;
    --grid:    #e1e0d9;
    --axis:    #c3c2b7;
    --ring:    rgba(11, 11, 11, .10);
    --weight:  #2a78d6;
    --fat:     #eb6834;
    --good:    #006300;
  }
  /* Selected for the dark surface, not flipped from the light one. */
  @media (prefers-color-scheme: dark) {
    :root {
      --plane:   #0d0d0d;
      --surface: #1a1a19;
      --ink:     #ffffff;
      --ink-2:   #c3c2b7;
      --muted:   #898781;
      --grid:    #2c2c2a;
      --axis:    #383835;
      --ring:    rgba(255, 255, 255, .10);
      --weight:  #3987e5;
      --fat:     #d95926;
      --good:    #0ca30c;
    }
  }

  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .sheet {
    max-width: 640px;
    margin-inline: auto;
    padding-inline: 16px;
    padding-block: 28px 40px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* --- masthead --- */
  .masthead { display: flex; flex-direction: column; gap: 6px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; color: var(--muted); }
  h1 {
    margin: 0;
    font-family: "Frank Ruehl CLM", FrankRuehl, "Times New Roman", Georgia, serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.15;
    text-wrap: balance;
  }
  .range { font-size: 13.5px; color: var(--ink-2); }
  .range b { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* --- stat row --- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    margin: 0;
    background: var(--grid);
    border: 1px solid var(--grid);
    border-radius: 3px;
    overflow: hidden;
  }
  /* The row holds between one and four cards — a single reading has no delta
     to show, and not everyone has named a goal. Without a column count that
     follows, the leftover tracks show as empty grey cells. */
  .stats.cols-1 { grid-template-columns: 1fr; }
  .stats.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .stats.cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 480px) {
    .stats.cols-3, .stats.cols-4 { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 13px 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .stat dt { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .stat dd {
    margin: 0;
    font-size: 25px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -.015em;
  }
  .stat dd .u { margin-inline-start: 3px; font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--ink-2); }
  .stat dd.down { color: var(--good); }

  /* --- figures --- */
  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--ring);
    border-radius: 3px;
    padding: 16px 14px 12px;
  }
  figcaption { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 10px; }
  .swatch { flex: none; width: 9px; height: 9px; border-radius: 2px; }
  .fig-title { font-size: 15px; font-weight: 700; }
  .fig-note { margin-inline-start: auto; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .fig-empty { font-size: 13.5px; color: var(--muted); }
  svg { display: block; width: 100%; height: auto; }

  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick, .month { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .month { font-size: 11.5px; font-variant-numeric: normal; }
  .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .goal { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .goal-label { fill: var(--muted); font-size: 11.5px; font-weight: 600; }
  .endpoint { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .startpoint { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  /* SVG text inherits none of the body font by default in every engine. */
  svg text { font-family: system-ui, -apple-system, "Segoe UI", "Arial Hebrew", Arial, sans-serif; }

  /* --- readings --- */
  details { background: var(--surface); border: 1px solid var(--ring); border-radius: 3px; padding: 0 14px; }
  summary { padding: 12px 0; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  summary:focus-visible { outline: 2px solid var(--weight); outline-offset: 2px; }
  .tables { display: flex; gap: 26px; flex-wrap: wrap; padding-bottom: 14px; }
  table { flex: 1 1 200px; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  caption { padding-bottom: 5px; text-align: start; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  th, td { padding: 4px 0; text-align: start; border-bottom: 1px solid var(--grid); color: var(--ink-2); }
  th { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  td.v { text-align: end; font-weight: 600; color: var(--ink); }

  footer { font-size: 12px; line-height: 1.65; color: var(--muted); }
</style>
</head>
<body>
<div class="sheet">

  <header class="masthead">
    <div class="eyebrow">דוח מעקב</div>
    <h1>$title</h1>
    <div class="range">$range_line</div>
  </header>

  $stats

  $figures

  $readings

  <footer>$footnote</footer>

</div>
</body>
</html>
